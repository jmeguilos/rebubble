<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,100..700,0..1&display=block" rel="stylesheet">
<style>
.ms { font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; display:inline-flex; line-height:1;
      letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; -webkit-font-smoothing:antialiased;
      font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; user-select:none; }
.ms.fill { font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24; }
</style>
<style>
/* Rebubble design tokens v2 — M3 baseline neutrals + ultramarine brand + semantic bubble colors.
   Surface ladder follows M3: surface < container-low < container < container-high < container-highest. */
:root {
  /* brand */
  --primary: #2D4FE0; --on-primary: #FFFFFF;
  --primary-container: #DCE1FF; --on-primary-container: #00105C;
  --secondary-container: #DFE1F9; --on-secondary-container: #171B2C;
  /* M3 baseline neutrals (lavender-tinted) */
  --surface: #FEF7FF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
  --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9;
  --on-surface: #1D1B20; --on-surface-variant: #49454F; --outline-variant: #CAC4D0;
  --error: #B3261E; --error-container: #F9DEDC; --on-error-container: #410E0B;
  /* semantics — never themed */
  --imessage: #0A7CFF; --sms: #34C759; --on-bubble: #FFFFFF;
  --incoming: #ECE6F0; --on-incoming: #1D1B20;
  /* shape scale */
  --radius-sheet: 28px; --radius-bubble: 20px; --radius-tight: 5px; --radius-chip: 8px;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-body: "Roboto", system-ui, sans-serif;
  /* per-contact avatar hues (cycle by contact hash) — M3 tone-90 bg / tone-10 fg */
  --av1-bg:#FFD9E2; --av1-fg:#3E001D;  --av2-bg:#DCE1FF; --av2-fg:#001159;
  --av3-bg:#B2EBE4; --av3-fg:#00201C;  --av4-bg:#FFDF9E; --av4-fg:#261A00;
  --av5-bg:#EADDFF; --av5-fg:#21005D;  --av6-bg:#C4EED0; --av6-fg:#002110;
}
.dark {
  --primary: #B9C3FF; --on-primary: #00184A;
  --primary-container: #1E3163; --on-primary-container: #DCE1FF;
  --secondary-container: #434659; --on-secondary-container: #DFE1F9;
  --surface: #141218; --surface-container-low: #1D1B20; --surface-container: #211F26;
  --surface-container-high: #2B292F; --surface-container-highest: #36343B;
  --on-surface: #E6E0E9; --on-surface-variant: #CAC4D0; --outline-variant: #49454F;
  --error: #F2B8B5; --error-container: #8C1D18; --on-error-container: #F9DEDC;
  --incoming: #2B292F; --on-incoming: #E6E0E9;
  --av1-bg:#5D1133; --av1-fg:#FFD9E2;  --av2-bg:#16307E; --av2-fg:#DCE1FF;
  --av3-bg:#00504A; --av3-fg:#B2EBE4;  --av4-bg:#5C4300; --av4-fg:#FFDF9E;
  --av5-bg:#4A2F87; --av5-fg:#EADDFF;  --av6-bg:#0E5223; --av6-fg:#C4EED0;
}
* { margin: 0; box-sizing: border-box; }
body { font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }

</style>
<style>
  body { display: flex; gap: 28px; padding: 24px; justify-content: center; background: #fff; }
  .phone { width: 390px; height: 780px; border-radius: 32px; overflow: hidden; background: var(--surface-container);
           box-shadow: 0 4px 24px rgba(0,0,0,.12); display: flex; flex-direction: column; }
  .status { height: 34px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:13px; font-weight:500; }
  .appbar { display:flex; align-items:flex-start; justify-content:space-between; padding: 2px 16px 12px; }
  .center { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .avatar { width:38px; height:38px; border-radius:50%; background:var(--primary-container); color:var(--on-primary-container);
            display:flex; align-items:center; justify-content:center; font-weight:500; }
  .name { font-size:13px; font-weight:500; }
  .iconbtn { width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--on-surface); }
  .sheet { flex:1; background:var(--surface); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
           display:flex; flex-direction:column; justify-content:flex-end; padding: 16px 12px 14px; gap:2px; }
  .day { align-self:center; font-size:12px; font-weight:500; color:var(--on-surface-variant); background:var(--surface-container-high);
         border-radius:12px; padding:5px 12px; margin-bottom:10px; }
  .bubble { max-width:76%; padding:10px 14px; font-size:16px; line-height:1.35; width:fit-content; position:relative; }
  .in { background:var(--incoming); align-self:flex-start; border-radius:20px 20px 20px 4px; }
  .in.last { border-radius:4px 20px 20px 20px; }
  .in.last::after { content:""; position:absolute; bottom:0; left:-6px; width:12px; height:12px;
                    background: radial-gradient(circle at 0 0, transparent 12px, var(--incoming) 12px); transform: scaleX(-1); }
  .out { background:var(--imessage); color:#fff; align-self:flex-end; border-radius:20px 20px 4px 20px; }
  .out.last { border-radius:20px 4px 20px 20px; }
  .out.last::after { content:""; position:absolute; bottom:0; right:-6px; width:12px; height:12px;
                     background: radial-gradient(circle at 0 0, transparent 12px, var(--imessage) 12px); }
  .micro { align-self:flex-end; font-size:12px; font-weight:500; color:var(--on-surface-variant); margin:3px 6px 0 0; }
  .gap { height: 10px; }
  .composerwrap { padding: 10px 12px 18px; display:flex; align-items:flex-end; gap:10px; background:var(--surface-container); }
  .plus { width:44px; height:44px; border-radius:50%; background:var(--surface-container-high); color:var(--on-surface-variant);
          display:flex; align-items:center; justify-content:center; font-size:22px; }
  .field { flex:1; min-height:44px; border-radius:24px; background:var(--surface-container-high); padding:11px 18px; font-size:16px; color:var(--on-surface-variant); }
  .send { width:44px; height:44px; }
</style></head><body>
<div class="phone">
  <div class="status"><span>9:41</span><span style="display:flex;gap:5px;align-items:center"><span class="ms" style="font-size:15px">signal_cellular_alt</span><span class="ms" style="font-size:15px">wifi</span><span class="ms fill" style="font-size:15px">battery_full</span></span></div>
  <div class="appbar">
    <div class="iconbtn"><span class="ms" style="font-size:24px">arrow_back</span></div>
    <div class="center"><div class="avatar">M</div><div class="name">Maya Chen</div></div>
    <div class="iconbtn"><span class="ms" style="font-size:24px">more_vert</span></div>
  </div>
  <div class="sheet">
    <div class="day">Today</div>
    <div class="bubble in">Are you coming tonight?</div>
    <div class="bubble in last">We're starting at 7</div>
    <div class="gap"></div>
    <div class="bubble out">Yes! Leaving soon</div>
    <div class="bubble out last">Save me a slice</div>
    <div class="micro">Delivered</div>
  </div>
  <div class="composerwrap"><div class="plus"><span class="ms" style="font-size:24px">add</span></div><div class="field">Message</div><div class="send"></div></div>
</div>
</body></html>
