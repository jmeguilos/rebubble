appId: app.rebubble.android
---
# Assumes prior successful flow-onboard.yaml (app already connected; do not clearState).
# Fixture server must be running. Triggers incoming via host-side HTTP (127.0.0.1).
- launchApp
- extendedWaitUntil:
    visible: "Fixture Friends"
    timeout: 30000
- runScript: receive-incoming.js
- extendedWaitUntil:
    visible: "Maestro fixture hello"
    timeout: 30000
- tapOn: "Maestro fixture hello"
- extendedWaitUntil:
    visible: "Message"
    timeout: 15000
- tapOn: "Message"
- inputText: "Maestro reply"
# NOTE (Maestro 2.6.0): the selector property `accessibilityText` was removed from the schema —
# flows using it now fail to *parse*. A plain `text:` selector matches an element's accessibility
# label as well as its text, so it is the current spelling for this tap.
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Maestro reply"
    timeout: 30000
